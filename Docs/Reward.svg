
<svg xmlns="http://www.w3.org/2000/svg"
     width="520" height="90"
     viewBox="0 0 520 90" fill="none">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="520" y2="90"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#302715"/>
      <stop offset="1" stop-color="#191919"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="90"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE49C"/>
      <stop offset="0.5" stop-color="#E9B94F"/>
      <stop offset="1" stop-color="#C58D28"/>
    </linearGradient>
  </defs>

  <!-- Badge Background -->
  <rect x="1" y="1" width="518" height="88" rx="15"
        fill="url(#bg)" stroke="#A7833B"
        stroke-width="1.5"/>

  <!-- Trophy Icon Background -->
  <rect x="17" y="17" width="56" height="56" rx="12"
        fill="#E9B94F" fill-opacity="0.10"/>

  <!-- Trophy: Lucide-inspired -->
  <g transform="translate(21 21) scale(2)"
     stroke="url(#gold)" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round"
     fill="none">
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
    <path d="M7 4h10v7a5 5 0 0 1-10 0V4Z"/>
    <path d="M7 6H4v2a4 4 0 0 0 4 4"/>
    <path d="M17 6h3v2a4 4 0 0 1-4 4"/>
  </g>

  <!-- Award Category -->
  <text x="94" y="37"
        fill="#D9B969" font-size="17"
        font-weight="600"
        font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    VR·AR 콘텐츠 제작 부문
  </text>

  <!-- Award Name -->
  <text x="94" y="66"
        fill="#FFF1C7" font-size="25"
        font-weight="800"
        font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    우수작품상
  </text>
</svg>
